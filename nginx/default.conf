server {
    # listen 80 default_server говорит Nginx, что этот блок обработает
    # абсолютно любой запрос на 80 порт, если не нашлось других совпадений
    listen 80 default_server;

    # Символ подчеркивания — это универсальный catch-all (поймать всё)
    server_name _;

    # Увеличиваем лимит на размер загружаемых файлов до 50 Мегабайт
    client_max_body_size 50M;

    # Блок для API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Блок для файлов карт
    location /maps/file/ {
        proxy_pass http://backend:8000/maps/file/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Блок для фронтенда Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}